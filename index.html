<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#75c9f1" />
  <meta name="description" content="Simple webcam-powered movement games for little kids." />
  <title>Go-Go Games</title>
  <style>
    :root { --ink:#153350; --sky:#75c9f1; --cream:#fff9dc; --red:#ef5a4f; --yellow:#ffd84c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif; color:var(--ink); background:linear-gradient(var(--sky) 0 66%,#b5e660 66%); }
    main { width:min(920px,92vw); margin:auto; padding:clamp(34px,7vh,74px) 0; }
    header { text-align:center; }
    h1 { margin:0; color:#fff; font-size:clamp(3rem,9vw,6rem); letter-spacing:.03em; line-height:.9; text-shadow:0 6px 0 #2a7ab2,0 10px 0 rgba(0,0,0,.08); }
    header p { margin:22px auto 36px; max-width:560px; font-size:clamp(1.1rem,3vw,1.5rem); font-weight:800; }
    .games { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr)); gap:24px; }
    .game { display:block; color:inherit; text-decoration:none; background:var(--cream); border:7px solid var(--ink); border-radius:32px; overflow:hidden; box-shadow:0 10px 0 rgba(21,51,80,.25); transition:transform .15s,box-shadow .15s; }
    .game:hover,.game:focus-visible { transform:translateY(-5px); box-shadow:0 15px 0 rgba(21,51,80,.25); outline:5px solid #fff; outline-offset:4px; }
    .picture { position:relative; height:240px; overflow:hidden; background:linear-gradient(#78cdf3 0 61%,#9dd657 61%); }
    .cloud { position:absolute; color:#fff; font-size:4rem; top:18px; left:24px; }
    .track { position:absolute; inset:auto 0 0; height:70px; background:#344656; border-top:8px solid #d6e3e7; }
    .train { position:absolute; left:40px; bottom:45px; width:190px; height:95px; background:#3089dc; border:6px solid var(--ink); border-radius:35px 18px 12px 12px; }
    .train::before { content:""; position:absolute; left:20px; top:-45px; width:56px; height:54px; background:var(--red); border:6px solid var(--ink); border-radius:12px 12px 0 0; }
    .train::after { content:"●   ●"; position:absolute; left:25px; bottom:-35px; color:#fff9dc; font-size:43px; letter-spacing:25px; line-height:1; text-shadow:0 0 0 var(--ink),3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink); white-space:nowrap; }
    .copy { padding:22px 25px 27px; }
    h2 { margin:0 0 7px; font-size:2rem; }
    .copy p { margin:0 0 18px; font-size:1.05rem; font-weight:700; line-height:1.4; }
    .play { display:inline-block; padding:11px 20px; color:#fff; background:var(--red); border-radius:99px; font-weight:900; box-shadow:0 5px 0 #a33837; }
    footer { text-align:center; margin-top:34px; font-weight:800; }
    footer a { color:var(--ink); }
  </style>
</head>
<body>
  <main>
    <header><h1>GO-GO GAMES</h1><p>Pick a game, get moving, and have fun!</p></header>
    <section class="games" aria-label="Choose a game">
      <a class="game" href="games/train/">
        <div class="picture" aria-hidden="true"><span class="cloud">☁</span><div class="track"></div><div class="train"></div></div>
        <div class="copy"><h2>Go, Go Train!</h2><p>Dance, wave, or wiggle to make the train roll.</p><span class="play">PLAY NOW →</span></div>
      </a>
    </section>
    <footer>Made for little movers. <a href="https://github.com/davidrs/go-go-games">Add your own game!</a></footer>
  </main>
</body>
</html>
